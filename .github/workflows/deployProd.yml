name: deployProd
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest  # Use ubuntu-latest as the operating system

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Checkout the code from your repository

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '7.0'  # Specify your .NET version here

    - name: Install dependencies and build
      run: |
        dotnet restore  # Restore dependencies
        dotnet build --configuration Release  # Build the project in Release mode
        dotnet publish -c Release -o publish  # Publish the project to the 'publish' folder

    - name: Transfer files to production
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        port: 22
        source: "publish/*"
        target: "/home/ec2-user/publish/"

    - name: Restart application
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_INSTALLERS_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_INSTALLERS_PRIVATE_KEY }}
        port: 22
        script: |
          sudo systemctl stop my-api.service
          sudo chown -R www-data:www-data /home/ec2-user/publish/
          sudo systemctl start my-api.service
